
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试体系分析报告</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .chart { text-align: center; margin: 20px 0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 5px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #667eea; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧪 测试体系分析报告</h1>
        <p>基于 146 个测试文件的全面分析</p>
    </div>
    
    <div class="section">
        <h2>📊 总体统计</h2>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">146</div>
                <div>测试文件总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">5</div>
                <div>测试目录数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">89</div>
                <div>Pytest文件</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">46</div>
                <div>Vitest文件</div>
            </div>
        </div>
    </div>
    
    <div class="section">
        <h2>🌳 文件结构树</h2>
        <div class="chart">
            <img src="test_structure_tree.png" alt="测试结构树状图" style="max-width: 100%; height: auto;">
        </div>
    </div>
    
    <div class="section">
        <h2>🔗 依赖关系图</h2>
        <div class="chart">
            <img src="test_dependency_graph.png" alt="依赖关系图" style="max-width: 100%; height: auto;">
        </div>
    </div>
    
    <div class="section">
        <h2>🍰 框架分布</h2>
        <div class="chart">
            <img src="framework_distribution.png" alt="框架分布图" style="max-width: 100%; height: auto;">
        </div>
    </div>
    
    <div class="section">
        <h2>⚠️ 发现的问题</h2>
        <ul>
            <li>循环依赖: 0 个</li>
            <li>框架混用: 需要统一测试框架</li>
            <li>依赖复杂: 需要简化依赖关系</li>
        </ul>
    </div>
</body>
</html>
