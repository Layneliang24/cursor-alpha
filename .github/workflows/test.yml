name: 测试和覆盖率

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 前端测试
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 安装前端依赖
      working-directory: ./frontend
      run: npm ci
      
    - name: 运行前端单元测试
      working-directory: ./frontend
      run: npm run test:unit
      
    - name: 运行前端集成测试
      working-directory: ./frontend
      run: npm run test:integration
      
    - name: 生成覆盖率报告
      working-directory: ./frontend
      run: npm run test:coverage
      
    - name: 上传覆盖率报告到Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        
    - name: 上传覆盖率报告到Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 30

  # 后端测试
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 缓存pip依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 安装后端依赖
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 设置环境变量
      working-directory: ./backend
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key" >> .env
        echo "DATABASE_URL=mysql://root:root@localhost:3306/test_db" >> .env
        
    - name: 运行数据库迁移
      working-directory: ./backend
      run: |
        python manage.py makemigrations
        python manage.py migrate
        
    - name: 运行后端单元测试
      working-directory: ./backend
      run: |
        python manage.py test tests.unit --verbosity=2 --coverage
        
    - name: 运行后端集成测试
      working-directory: ./backend
      run: |
        python manage.py test tests.integration --verbosity=2
        
    - name: 生成覆盖率报告
      working-directory: ./backend
      run: |
        coverage html
        coverage xml
        
    - name: 上传覆盖率报告到Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        
    - name: 上传覆盖率报告到Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/htmlcov/
        retention-days: 30

  # E2E测试
  e2e-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装前端依赖
      working-directory: ./frontend
      run: npm ci
      
    - name: 安装后端依赖
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 设置环境变量
      working-directory: ./backend
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key" >> .env
        echo "DATABASE_URL=mysql://root:root@localhost:3306/test_db" >> .env
        
    - name: 运行数据库迁移
      working-directory: ./backend
      run: |
        python manage.py makemigrations
        python manage.py migrate
        
    - name: 启动后端服务
      working-directory: ./backend
      run: |
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10
        
    - name: 构建前端
      working-directory: ./frontend
      run: npm run build
      
    - name: 启动前端服务
      working-directory: ./frontend
      run: |
        npm run preview &
        sleep 10
        
    - name: 安装Playwright
      working-directory: ./frontend
      run: npx playwright install --with-deps
      
    - name: 运行E2E测试
      working-directory: ./frontend
      run: npx playwright test
      
    - name: 上传E2E测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: frontend/test-results/
        retention-days: 30

  # 测试质量门禁
  test-quality-gate:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, e2e-test]
    
    steps:
    - name: 下载覆盖率报告
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage-report
        path: ./frontend-coverage
        
    - name: 下载后端覆盖率报告
      uses: actions/download-artifact@v4
      with:
        name: backend-coverage-report
        path: ./backend-coverage
        
    - name: 检查测试覆盖率
      run: |
        echo "检查前端覆盖率..."
        if [ -f "./frontend-coverage/lcov.info" ]; then
          echo "前端覆盖率报告存在"
        else
          echo "前端覆盖率报告缺失"
          exit 1
        fi
        
        echo "检查后端覆盖率..."
        if [ -d "./backend-coverage" ]; then
          echo "后端覆盖率报告存在"
        else
          echo "后端覆盖率报告缺失"
          exit 1
        fi
        
    - name: 发送测试结果通知
      if: always()
      run: |
        echo "测试完成！"
        echo "前端测试: ${{ needs.frontend-test.result }}"
        echo "后端测试: ${{ needs.backend-test.result }}"
        echo "E2E测试: ${{ needs.e2e-test.result }}"
        
    - name: 测试失败通知
      if: failure()
      run: |
        echo "❌ 测试失败！"
        echo "请检查测试报告并修复问题。"
        
    - name: 测试成功通知
      if: success()
      run: |
        echo "✅ 所有测试通过！"
        echo "代码质量符合要求。"